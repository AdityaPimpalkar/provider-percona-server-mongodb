name: Build and Push Dev Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write       # needed to push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/provider-percona-server-mongodb-dev

jobs:
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Multi-platform image builds require QEMU for emulation of non-native
      # architectures (arm64, s390x, ppc64le) on the amd64 GitHub runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # BuildKit (Buildx) is required for multi-platform builds and layer caching.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate OCI-standard labels and tags:
      #   - ghcr.io/openeverest/provider-percona-server-mongodb-dev:latest  (branch=main)
      #   - ghcr.io/openeverest/provider-percona-server-mongodb-dev:<sha>
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # Build and push the multi-platform image.
      # Layer cache is stored in the registry itself (mode=max preserves all
      # intermediate layers, improving cache hit rates for incremental builds).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          # Surface Go build cache as a named build arg for layer caching
          build-args: |
            BUILDKIT_INLINE_CACHE=1
